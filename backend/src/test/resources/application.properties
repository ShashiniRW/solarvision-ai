# ------------------------------------------------------------------
# TEST configuration. During tests this file REPLACES the main
# application.properties. Only fake test values: safe to commit.
# The database comes from Testcontainers (see TestcontainersConfiguration).
# ------------------------------------------------------------------
spring.application.name=solarvision-backend-test

# JPA / Hibernate: check every entity against the schema built by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway: run all migrations on the empty test database
spring.flyway.enabled=true

# JWT: a fake secret for tests only (64 characters)
app.jwt.secret=TestOnlySecretForAutomatedTestsNeverUseInProduction0123456789ABC
app.jwt.expiration-ms=3600000

# The simulator must never run during tests
app.simulator.enabled=false
app.simulator.interval-ms=60000
app.simulator.fault-probability=0.0

spring.web.error.include-stacktrace=never
app.cors.allowed-origins=http://localhost:3000
