# Continuous Integration: build and test backend, frontend and AI service on every push / pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow can only read the repository
permissions:
  contents: read

# If you push again quickly, cancel the older run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25, Maven, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # -B = batch mode (clean logs), -ntp = no download progress lines
      # verify = compile + all unit tests + the Testcontainers integration test
      - name: Build and test
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Node 22, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # the real value lives in .env.local (not in Git); the build only needs a placeholder
      BACKEND_URL: http://localhost:8080
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci = install exactly what package-lock.json says (reproducible)
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  ai-service:
    name: AI service (Python 3.14, uv, Ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      # uv reads .python-version and installs Python 3.14 itself
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock

      # --locked = install exactly what uv.lock says; fail if uv.lock is out of date
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
