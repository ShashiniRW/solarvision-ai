# Production / Docker settings. Active only with SPRING_PROFILES_ACTIVE=prod.
# No secrets here: every ${NAME} comes from an environment variable.

spring.application.name=solarvision-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=8080
spring.web.error.include-stacktrace=never

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.simulator.enabled=${SIMULATOR_ENABLED:false}
app.simulator.interval-ms=${SIMULATOR_INTERVAL_MS:60000}
app.simulator.fault-probability=${SIMULATOR_FAULT_PROBABILITY:0.0}

app.ai.base-url=${AI_BASE_URL:http://ai-service:8000}
app.ai.internal-api-key=${AI_INTERNAL_API_KEY}

# Demo mode: only for evaluation environments
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.password=${DEMO_PASSWORD:}
